<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Rebalance · Allocation</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <div class="main">
        <div class="ringwrap">
          <svg class="ring" id="ring" viewBox="0 0 380 392" role="img" aria-labelledby="chart-title chart-description">
            <title id="chart-title">Allocation unavailable</title>
            <desc id="chart-description">Connecting to the local app.</desc>
            <g transform="rotate(-90 190 190)">
              <circle class="track" cx="190" cy="190" r="150" fill="none" stroke-width="44"/>
              <g id="arcs"></g>
              <g id="targets"></g>
              <circle class="ghost" id="ghost" cx="190" cy="190" r="150" fill="none" stroke-width="44" pathLength="100"/>
            </g>
            <text class="ctr-state" id="c-state" x="190" y="184">Connecting</text>
            <text class="ctr-sub" id="c-sub" x="190" y="206">Local allocation</text>
            <text class="ctr-val" id="c-val" x="190" y="228"></text>
            <text class="ctr-val" id="c-legend" x="190" y="378"></text>
          </svg>
        </div>
        <div class="holdings" id="holdings"></div>
      </div>

      <div class="discl">
        <button class="summary" id="sum" aria-expanded="false" aria-controls="panel">
          <i class="pulse idle" id="pulse" aria-hidden="true"></i>
          <span class="stext" id="stext">Connecting to the local app</span>
          <svg class="chev" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="panel" id="panel"><div class="panelin"><div class="panelpad">
          <section>
            <p class="cap">Why this trade</p>
            <div class="chain">
              <div class="step"><span class="cap">You asked</span><span class="sval" id="why-ask">—</span></div>
              <div class="step"><span class="cap">Strategy</span><span class="sval" id="risk-model">Target risk · connecting</span></div>
              <div class="step"><span class="cap">Trade</span><span class="sval" id="why-trade">—</span></div>
              <div class="step"><span class="cap">Receipt</span><span class="sval mono" id="why-receipt">—</span></div>
            </div>
            <p class="foot" id="risk-model-title"></p>
          </section>
          <section>
            <p class="cap">Fees</p>
            <div class="kv">
              <span class="kvline" id="gas">ETH gas · unavailable</span>
              <span class="kvline" id="gas-price">Gas price · unavailable</span>
              <span class="kvline" id="gas-estimate">Swap estimate · unavailable</span>
              <span class="kvline" id="gas-rebalance">Rebalance estimate · unavailable</span>
            </div>
          </section>
          <section>
            <p class="cap">Settings</p>
            <div class="kv">
              <span class="kvline" id="set-band">Rebalance when off by · unavailable</span>
              <span class="kvline" id="set-every">Check every · unavailable</span>
              <span class="kvline" id="set-sign">Signing · unavailable</span>
            </div>
          </section>
        </div></div></div>
      </div>
    </main>
  </body>
</html>
