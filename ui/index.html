<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Rebalance · Allocation</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/view-client.js" defer></script>
    <script src="/allocation-ring.js" defer></script>
    <script src="/portfolio-controls.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="chart-shell">
    <nav class="chart-nav" aria-label="Portfolio navigation">
      <a id="portfolios-back" href="/">← Portfolios</a>
      <div class="portfolio-actions">
        <button id="copy-address" class="address-button" type="button" disabled>
          <svg class="control-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"/></svg>
          <span id="copy-address-label">Address</span>
        </button>
        <button id="portfolio-run" class="run-button" type="button" disabled>Unavailable</button>
      </div>
    </nav>
    <div id="funding-fallback" class="funding-fallback" hidden><input id="funding-address" readonly aria-label="Funding address on Robinhood chain 4663" spellcheck="false"></div>
    <p id="control-message" class="control-message" role="status" hidden></p>
    <svg id="allocation" viewBox="-15 0 570 620" role="img" aria-labelledby="chart-title chart-description">
      <title id="chart-title">Allocation unavailable</title>
      <desc id="chart-description">Connecting to the local app.</desc>
      <defs>
        <mask id="actual-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="540" height="540">
          <rect x="0" y="0" width="540" height="540" fill="white"/>
          <g id="actual-dividers"></g>
        </mask>
        <mask id="target-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="540" height="540">
          <rect x="0" y="0" width="540" height="540" fill="white"/>
          <g id="target-dividers"></g>
        </mask>
      </defs>
      <g id="actual-ring" transform="rotate(-90 270 270)" mask="url(#actual-mask)">
        <circle class="track" cx="270" cy="270" r="164" fill="none" stroke-width="78"/>
        <g id="segments"></g>
      </g>
      <g id="target-ring" transform="rotate(-90 270 270)" mask="url(#target-mask)">
        <g id="target-segments"></g>
      </g>
      <g id="labels"></g>
      <text id="state" x="270" y="257" class="state">Connecting</text>
      <text id="note" x="270" y="280" class="note">Local allocation</text>
      <text id="comparison" x="270" y="305" class="comparison"></text>
      <g aria-labelledby="risk-model-title">
        <title id="risk-model-title">Connecting to the saved target risk model.</title>
        <text id="risk-model" x="30" y="525" class="gas risk-model">Target risk · connecting</text>
      </g>
      <text id="gas" x="30" y="546" class="gas">ETH gas · unavailable</text>
      <text id="gas-price" x="30" y="565" class="gas gas-price">Gas price · unavailable</text>
      <text id="gas-estimate" x="30" y="584" class="gas gas-price">Swap estimate · unavailable</text>
      <text id="gas-rebalance" x="30" y="603" class="gas gas-price">Rebalance estimate · unavailable</text>
    </svg>
    </main>
  </body>
</html>
