<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Rebalance · Allocation</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/view-client.js" defer></script>
    <script src="/allocation-ring.js" defer></script>
    <script src="/portfolio-controls.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="chart-shell">
      <nav class="chart-nav" aria-label="Portfolio navigation">
        <a id="portfolios-back" href="/">← Portfolios</a>
        <div class="portfolio-actions">
          <a id="wallet-explorer" class="address-link" role="link" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" aria-disabled="true" tabindex="-1">
            <svg class="control-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M11 3h6v6M17 3l-8 8M8 4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3"/></svg>
            <span id="wallet-explorer-label">Address</span>
          </a>
          <button id="portfolio-run" class="run-button" type="button" disabled>Unavailable</button>
        </div>
      </nav>

      <div class="main">
        <svg class="ring" id="ring" viewBox="-60 -20 560 480" role="img" aria-labelledby="chart-title chart-description">
          <defs>
            <title id="chart-title">Allocation unavailable</title>
            <desc id="chart-description">Connecting to the local app.</desc>
          </defs>
          <g transform="rotate(-90 210 210)">
            <circle class="track" cx="210" cy="210" r="150" fill="none" stroke-width="44"/>
            <g id="arcs"></g>
            <g id="targets"></g>
            <circle class="ghost" id="ghost" cx="210" cy="210" r="150" fill="none" stroke-width="44" pathLength="100"/>
          </g>
          <g id="labels"></g>
          <text class="ctr-state" id="c-state" x="210" y="202">Connecting</text>
          <text class="ctr-sub" id="c-sub" x="210" y="226">Local allocation</text>
          <text class="ctr-val" id="c-val" x="210" y="249"></text>
          <text class="ctr-val" id="c-legend" x="210" y="444"></text>
        </svg>
      </div>

      <div class="discl">
        <div class="measure"><button class="summary" id="sum" aria-expanded="false" aria-controls="panel">
          <span class="stext">Details</span>
          <svg class="chev" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button></div>
        <div class="panel" id="panel"><div class="panelin"><div class="panelpad measure">
          <div class="pair">
            <section>
              <p class="cap">Fees</p>
              <dl class="rows">
                <div><dt>Balance</dt><dd id="gas">unavailable</dd></div>
                <div><dt>Gas price</dt><dd id="gas-price">unavailable</dd></div>
                <div><dt>One swap</dt><dd id="gas-estimate">unavailable</dd></div>
                <div><dt>Full rebalance</dt><dd id="gas-rebalance">unavailable</dd></div>
              </dl>
            </section>
            <section>
              <p class="cap">When it trades</p>
              <dl class="rows">
                <div><dt>Rebalance when off by</dt><dd id="set-band">unavailable</dd></div>
                <div><dt>Cycle interval</dt><dd id="set-every">unavailable</dd></div>
              </dl>
            </section>
          </div>
        </div></div></div>
      </div>
    </main>
    <p id="control-message" class="control-message" role="status" hidden></p>
  </body>
</html>
