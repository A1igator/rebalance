<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Rebalance · Allocation</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/view-client.js" defer></script>
    <script src="/allocation-ring.js" defer></script>
    <script src="/portfolio-controls.js" defer></script>
    <script src="/share-code.js" defer></script>
    <script src="/stock-links.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="chart-shell">
      <nav class="chart-nav" aria-label="Portfolio navigation">
        <a id="portfolios-back" href="/">← Portfolios</a>
        <div class="portfolio-actions">
          <button id="share-code" class="share-button" type="button" disabled title="Share code unavailable until the saved targets load.">
            <svg class="control-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></svg>
            <span id="share-code-label" aria-live="polite">Share</span>
          </button>
          <a id="wallet-explorer" class="address-link" role="link" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" aria-disabled="true" tabindex="-1">
            <svg class="control-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M11 3h6v6M17 3l-8 8M8 4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3"/></svg>
            <span id="wallet-explorer-label">Address</span>
          </a>
          <button id="portfolio-run" class="run-button" type="button" disabled>Unavailable</button>
        </div>
      </nav>

      <div class="main">
        <svg class="ring" id="ring" viewBox="-60 -20 560 480" role="group" aria-labelledby="chart-title chart-description">
          <defs>
            <title id="chart-title">Allocation unavailable</title>
            <desc id="chart-description">Connecting to the local app.</desc>
          </defs>
          <g transform="rotate(-90 210 210)">
            <circle class="track" cx="210" cy="210" r="150" fill="none" stroke-width="44"/>
            <g id="arcs"></g>
            <g id="targets"></g>
            <circle class="ghost" id="ghost" cx="210" cy="210" r="150" fill="none" stroke-width="44" pathLength="100"/>
          </g>
          <g id="labels"></g>
          <foreignObject x="121" y="120" width="178" height="180">
            <div xmlns="http://www.w3.org/1999/xhtml" class="centre">
              <p class="ctr-state" id="c-state">Connecting</p>
              <div class="ctr-hint">
                <p class="ctr-sub" id="c-sub">Local allocation</p>
                <button id="ledger-retry" class="retry-button" type="button" aria-label="Retry Ledger rebalance" aria-describedby="c-sub" aria-busy="false" title="Retry Ledger rebalance" hidden disabled>
                  <svg class="control-icon retry-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M16.5 8a6.5 6.5 0 1 0 .1 3M16.5 3.5V8H12"/></svg>
                </button>
              </div>
              <p class="ctr-val" id="c-val"></p>
            </div>
          </foreignObject>
        </svg>
      </div>

      <section class="settings" aria-label="Portfolio settings">
        <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
        <div class="settings-panel" id="settings-panel" role="region" aria-labelledby="settings-toggle" aria-hidden="true" inert>
          <div class="settings-clip"><div class="settings-content">
            <dl class="settings-rows" aria-label="Rebalance settings">
              <div><dt>Drift trigger</dt><dd id="set-band">Unavailable</dd></div>
              <div><dt>Cycle interval</dt><dd id="set-every">Unavailable</dd></div>
              <div><dt>Fee target</dt><dd id="set-fee-target">Not set</dd></div>
            </dl>
          </div></div>
        </div>
      </section>
    </main>
    <p id="control-message" class="control-message" role="status" hidden></p>
  </body>
</html>
