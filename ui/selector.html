<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Rebalance · Portfolios</title>
    <link rel="stylesheet" href="/selector.css">
    <script src="/view-client.js" defer></script>
    <script src="/selector.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Rebalance</p>
        <h1>Portfolios</h1>
        <p class="intro">Choose a wallet to view its allocation.</p>
      </header>
      <p id="view-notice" class="notice" role="status">Checking the view link…</p>
      <p id="portfolio-status" class="load-status" role="status">Loading portfolios…</p>
      <div id="portfolio-grid" class="portfolio-grid" aria-label="Wallet portfolios"></div>
      <button id="reload-portfolios" class="text-button" type="button" hidden>Try again</button>
    </main>
    <dialog id="setup-dialog" aria-labelledby="setup-title" aria-describedby="setup-description">
      <div class="dialog-heading"><h2 id="setup-title">New portfolio</h2><button id="close-setup" class="close-button" type="button" aria-label="Close setup">×</button></div>
      <p id="setup-description">Choose how to sign. Your agent will guide the setup in chat.</p>
      <div class="signer-options">
        <button id="setup-private-key" class="signer-option" type="button"><strong>Local key</strong><span>A wallet managed on this computer</span></button>
        <button id="setup-privy" class="signer-option" type="button"><strong>Privy</strong><span>An agent wallet through Privy</span></button>
        <button id="setup-ledger" class="signer-option" type="button"><strong>Ledger</strong><span>Sign with your hardware wallet</span></button>
      </div>
      <p id="setup-status" class="setup-status" role="status"></p>
      <button id="retry-setup" class="text-button" type="button" hidden>Check request again</button>
    </dialog>
  </body>
</html>
